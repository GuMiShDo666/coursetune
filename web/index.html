<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CourseTune 产品开发课程助手</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #657086;
      --line: #d8dee9;
      --panel: #f7f9fc;
      --surface: #ffffff;
      --brand: #2457d6;
      --brand-dark: #173b98;
      --ok: #168a55;
      --warn: #b66a00;
      --shadow: 0 16px 40px rgba(26, 38, 68, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: #eef2f7;
    }

    .shell {
      display: grid;
      grid-template-columns: 320px minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 28px 22px;
      background: var(--surface);
      border-right: 1px solid var(--line);
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-width: 0;
      padding: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: var(--brand);
      color: white;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .section-title {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      font-size: 14px;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: var(--warn);
    }

    .dot.ok {
      background: var(--ok);
    }

    .templates {
      display: grid;
      gap: 8px;
    }

    .template {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      font: inherit;
      cursor: pointer;
    }

    .template:hover {
      border-color: var(--brand);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    select,
    input,
    textarea,
    button {
      font: inherit;
    }

    select {
      height: 38px;
      padding: 0 34px 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--surface);
    }

    .ghost,
    .primary {
      height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      cursor: pointer;
    }

    .ghost {
      background: var(--surface);
      color: var(--ink);
    }

    .primary {
      border-color: var(--brand);
      background: var(--brand);
      color: white;
      font-weight: 700;
    }

    .primary:hover {
      background: var(--brand-dark);
    }

    .chat {
      overflow: auto;
      min-height: 0;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .message {
      max-width: 900px;
      margin-bottom: 18px;
      display: grid;
      gap: 7px;
    }

    .role {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .bubble {
      width: fit-content;
      max-width: min(900px, 100%);
      padding: 12px 14px;
      border-radius: 8px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      background: var(--panel);
      border: 1px solid var(--line);
    }

    .message.user {
      margin-left: auto;
      justify-items: end;
    }

    .message.user .bubble {
      background: #e8efff;
      border-color: #c6d5ff;
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      margin-top: 18px;
    }

    textarea {
      min-height: 64px;
      max-height: 180px;
      resize: vertical;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--surface);
    }

    .send {
      width: 92px;
      min-height: 64px;
    }

    .meta {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 860px) {
      .shell {
        grid-template-columns: 1fr;
      }

      aside {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      main {
        padding: 20px;
      }

      .toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .composer {
        grid-template-columns: 1fr;
      }

      .send {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <div class="mark">CT</div>
        <div>
          <h1>CourseTune</h1>
          <div class="subtitle">EBU5606 产品开发课程助手</div>
        </div>
      </div>

      <section>
        <p class="section-title">模型状态</p>
        <div class="status">
          <span id="statusText">等待连接</span>
          <span class="dot" id="statusDot"></span>
        </div>
      </section>

      <section>
        <p class="section-title">常用问题</p>
        <div class="templates">
          <button class="template" data-question="请解释 New Product Development 在课程中的含义。">解释 NPD</button>
          <button class="template" data-question="列出 generic product development process 的六个阶段。">开发流程阶段</button>
          <button class="template" data-question="Real-Win-Worth-it 方法关注哪三个问题？">RWW 方法</button>
          <button class="template" data-question="请比较 concept screening 和 concept scoring。">概念筛选对比</button>
        </div>
      </section>
    </aside>

    <main>
      <div class="toolbar">
        <div>
          <h2>课程问答测试台</h2>
          <div class="meta">Qwen3-4B LoRA · Product Development</div>
        </div>
        <div class="controls">
          <select id="temperature" aria-label="温度">
            <option value="0.2">严谨</option>
            <option value="0.5" selected>平衡</option>
            <option value="0.8">发散</option>
          </select>
          <button class="ghost" id="clearBtn">清空</button>
        </div>
      </div>

      <div class="chat" id="chat">
        <div class="message assistant">
          <div class="role">课程助手</div>
          <div class="bubble">请输入 EBU5606 产品开发课程问题。</div>
        </div>
      </div>

      <form class="composer" id="chatForm">
        <textarea id="prompt" placeholder="输入你的课程问题，例如：产品机会识别有哪些步骤？"></textarea>
        <button class="primary send" type="submit">发送</button>
      </form>
    </main>
  </div>

  <script>
    const chat = document.querySelector("#chat");
    const form = document.querySelector("#chatForm");
    const promptInput = document.querySelector("#prompt");
    const statusText = document.querySelector("#statusText");
    const statusDot = document.querySelector("#statusDot");
    const temperature = document.querySelector("#temperature");

    const messages = [
      {
        role: "system",
        content: "你是 EBU5606 产品开发课程资料智能答疑助手。只根据课程资料回答；如果资料不足，就说明无法从资料中确定。"
      }
    ];

    function setStatus(text, ok = false) {
      statusText.textContent = text;
      statusDot.classList.toggle("ok", ok);
    }

    function addMessage(role, content) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role === "user" ? "user" : "assistant"}`;
      const label = document.createElement("div");
      label.className = "role";
      label.textContent = role === "user" ? "你" : "课程助手";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = content;
      wrapper.append(label, bubble);
      chat.appendChild(wrapper);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    async function ask(question) {
      const trimmed = question.trim();
      if (!trimmed) return;

      messages.push({ role: "user", content: trimmed });
      addMessage("user", trimmed);
      promptInput.value = "";
      const answerBubble = addMessage("assistant", "思考中...");
      setStatus("生成中", false);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages,
            temperature: Number(temperature.value)
          })
        });

        if (!response.ok) {
          throw new Error(await response.text());
        }

        const payload = await response.json();
        const content = payload.choices?.[0]?.message?.content || "没有返回内容。";
        answerBubble.textContent = content;
        messages.push({ role: "assistant", content });
        setStatus("已连接", true);
      } catch (error) {
        answerBubble.textContent = `请求失败：${error.message}`;
        setStatus("连接失败", false);
      }
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      ask(promptInput.value);
    });

    document.querySelector("#clearBtn").addEventListener("click", () => {
      messages.splice(1);
      chat.innerHTML = "";
      addMessage("assistant", "请输入 EBU5606 产品开发课程问题。");
    });

    document.querySelectorAll(".template").forEach((button) => {
      button.addEventListener("click", () => {
        promptInput.value = button.dataset.question;
        promptInput.focus();
      });
    });

    setStatus("等待连接", false);
  </script>
</body>
</html>
